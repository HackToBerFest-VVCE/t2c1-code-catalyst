<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tm-border" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE072"/>
      <stop offset="50%" stop-color="#F8D057"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="tm-gold" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="40%" stop-color="#F8D057"/>
      <stop offset="100%" stop-color="#D99E18"/>
    </linearGradient>
    <linearGradient id="tm-solana" x1="10" y1="10" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="50%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#F8D057"/>
    </linearGradient>
    <radialGradient id="tm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(248, 208, 87, 0.35)"/>
      <stop offset="100%" stop-color="rgba(248, 208, 87, 0)"/>
    </radialGradient>
    <filter id="tm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Glass Surface -->
  <rect x="1" y="1" width="38" height="38" rx="11" fill="#14161A" stroke="url(#tm-border)" stroke-width="1.5" filter="url(#tm-shadow)"/>
  
  <!-- Subtle Internal Radial Aura -->
  <circle cx="20" cy="20" r="16" fill="url(#tm-glow)"/>

  <!-- Compass Star / Chakra Radial Guides -->
  <circle cx="20" cy="20" r="11" stroke="rgba(248, 208, 87, 0.25)" stroke-width="0.75" stroke-dasharray="1.5 2.5"/>
  <line x1="20" y1="5.5" x2="20" y2="8" stroke="url(#tm-gold)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="20" y2="34.5" stroke="url(#tm-gold)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5.5" y1="20" x2="8" y2="20" stroke="url(#tm-gold)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="34.5" y2="20" stroke="url(#tm-gold)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dynamic Flying Wing / Travel Navigation Dart -->
  <path d="M20 9L29 27.5L20 23.5L11 27.5L20 9Z" fill="url(#tm-gold)" filter="url(#tm-shadow)"/>
  <path d="M20 11.5L26.5 25L20 22.2L13.5 25L20 11.5Z" fill="#181A20" opacity="0.15"/>
  <path d="M20 9L20 23.5L11 27.5L20 9Z" fill="rgba(255, 255, 255, 0.2)"/>

  <!-- Solana Crypto Trust Orbit Ring -->
  <ellipse cx="20" cy="21.5" rx="8" ry="3.5" transform="rotate(-25 20 21.5)" stroke="url(#tm-solana)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="18 4"/>

  <!-- Center Core Node Point -->
  <circle cx="20" cy="20" r="1.5" fill="#FFF"/>
</svg>
