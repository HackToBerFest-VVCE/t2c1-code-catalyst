  <line x1="590" y1="380" x2="590" y2="410" stroke="#652733" stroke-width="2"/>
  <line x1="630" y1="380" x2="630" y2="410" stroke="#652733" stroke-width="2"/>

  <!-- Sacred River Lamps / Diyas floating on water -->
  <circle cx="320" cy="505" r="4" fill="#AD8958"/>
  <circle cx="460" cy="515" r="4" fill="#AD8958"/>
