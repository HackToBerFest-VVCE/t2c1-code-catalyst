<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Stepped Base Platform -->
  <line x1="140" y1="510" x2="660" y2="510" stroke="#652733" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="490" x2="630" y2="490" stroke="#652733" stroke-width="2.5"/>
  <line x1="200" y1="475" x2="600" y2="475" stroke="#652733" stroke-width="2"/>

  <!-- Main Monument Pylons -->
  <path d="M220 475 L240 220 L320 220 L335 475 Z" stroke="#652733" stroke-width="3.5" fill="rgba(101,39,51,0.05)"/>
  <path d="M465 475 L480 220 L560 220 L580 475 Z" stroke="#652733" stroke-width="3.5" fill="rgba(101,39,51,0.05)"/>

  <!-- Grand Central Archway -->
  <path d="M335 475 V320 Q400 240 465 320 V475 Z" stroke="#652733" stroke-width="3.5" fill="rgba(101,39,51,0.08)"/>
  <path d="M350 475 V330 Q400 260 450 330 V475 Z" stroke="#652733" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Horizontal Entablature & Inscription Cornice -->
  <rect x="210" y="190" width="380" height="30" rx="2" stroke="#652733" stroke-width="3" fill="rgba(101,39,51,0.08)"/>
  <line x1="220" y1="205" x2="580" y2="205" stroke="#652733" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Stepped Attic & Top Cornice -->
  <rect x="240" y="160" width="320" height="30" stroke="#652733" stroke-width="2.8" fill="rgba(101,39,51,0.05)"/>
  <rect x="280" y="135" width="240" height="25" stroke="#652733" stroke-width="2.5"/>
  <!-- Top Shallow Dome -->
  <path d="M340 135 Q400 110 460 135 Z" stroke="#652733" stroke-width="3" fill="#652733" fill-opacity="0.2"/>
  <circle cx="400" cy="112" r="5" fill="#652733"/>

  <!-- Amar Jawan Jyoti (Eternal Flame) under archway -->
  <path d="M385 475 L390 445 L410 445 L415 475 Z" stroke="#652733" stroke-width="2" fill="#652733" fill-opacity="0.3"/>
  <line x1="400" y1="445" x2="400" y2="415" stroke="#652733" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M400 415 Q408 402 400 392 Q392 402 400 415 Z" fill="#AD8958" stroke="#652733" stroke-width="1"/>

  <!-- Delicate Horizon Ground Swell -->
  <path d="M80 520 Q400 500 720 520" stroke="#652733" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>