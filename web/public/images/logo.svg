<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>

    <!-- Golden Yellow Gradient -->
    <linearGradient id="goldGradient" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE779" />
      <stop offset="50%" stop-color="#F8D057" />
      <stop offset="100%" stop-color="#DDA615" />
    </linearGradient>

    <!-- Solana Cyber Gradient -->
    <linearGradient id="solanaGrad" x1="20" y1="90" x2="100" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGradient)" stroke="#2C2D35" stroke-width="1.5" />
  
  <!-- Subtle Outer Border Accent -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.3" />

  <!-- Background Cyber Orbit & Constellation Lines -->
  <circle cx="60" cy="60" r="38" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="3 4" stroke-width="1.2" />
  <circle cx="60" cy="60" r="28" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Solana Verification Bar Accents (Top & Bottom subtle slants) -->
  <path d="M42 32 L78 32" stroke="url(#solanaGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
  <path d="M48 88 L72 88" stroke="url(#solanaGrad)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Shield Base (Proof) Outer Contour -->
  <path d="M60 22 L84 34 V58 C84 73 73.5 86 60 92 C46.5 86 36 73 36 58 V34 L60 22 Z" 
        stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.4" fill="#18181D" fill-opacity="0.7" />

  <!-- Dynamic Supersonic Travel Dart / Airplane intersecting Compass -->
  <g filter="url(#yellowGlow)">
    <!-- Right Wing of Plane -->
    <path d="M60 28 L82 66 L60 56 Z" fill="url(#goldGradient)" />
    <!-- Left Wing of Plane (slight shade for depth) -->
    <path d="M60 28 L38 66 L60 56 Z" fill="#E5B834" />
    <!-- Center Keel / Fuselage with Solana accent line -->
    <path d="M60 28 L60 76" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Verification Checkpoint Node (Anchor Commitment Dot) -->
  <circle cx="60" cy="78" r="4.5" fill="#14F195" filter="url(#subtleShadow)" />
  <circle cx="60" cy="78" r="2" fill="#FFFFFF" />

  <!-- Futuristic Corner Targets / HUD Accents -->
  <path d="M16 26 V18 H26" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M104 26 V18 H94" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M16 94 V102 H26" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M104 94 V102 H94" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>
