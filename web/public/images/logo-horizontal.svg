<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hzGoldGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE779" />
      <stop offset="50%" stop-color="#F8D057" />
      <stop offset="100%" stop-color="#DDA615" />
    </linearGradient>

    <linearGradient id="hzSolanaGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#14F195" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>

    <linearGradient id="hzBgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>

    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Squircle Frame -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#hzBgGrad)" stroke="#2C2D35" stroke-width="1.5" />
    <rect x="0" y="0" width="80" height="80" rx="20" fill="none" stroke="url(#hzGoldGrad)" stroke-width="1" stroke-opacity="0.35" />

    <!-- Shield Outline -->
    <path d="M40 14 L58 23 V41 C58 52 50.5 61.5 40 66 C29.5 61.5 22 52 22 41 V23 L40 14 Z" 
          stroke="url(#hzGoldGrad)" stroke-width="1.5" stroke-opacity="0.4" fill="#18181D" fill-opacity="0.7" />

    <!-- Jet Dart / Plane -->
    <g filter="url(#hzGlow)">
      <path d="M40 18 L56 46 L40 39 Z" fill="url(#hzGoldGrad)" />
      <path d="M40 18 L24 46 L40 39 Z" fill="#D4A424" />
      <path d="M40 18 L40 54" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Node Anchor -->
    <circle cx="40" cy="56" r="3.5" fill="#14F195" />
    <circle cx="40" cy="56" r="1.5" fill="#FFFFFF" />

    <!-- Solana Mini Hash Indicator -->
    <path d="M26 68 L54 68" stroke="url(#hzSolanaGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
  </g>

  <!-- Brand Typography -->
  <!-- "Proof" in bright pure white -->
  <text x="108" y="58" font-family="'DM Sans', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
    Proof<tspan fill="url(#hzGoldGrad)">Trip</tspan>
  </text>

  <!-- Devnet / AI Pill Badge -->
  <g transform="translate(290, 34)">
    <rect x="0" y="0" width="112" height="24" rx="12" fill="#1F1B12" stroke="rgba(248, 208, 87, 0.4)" stroke-width="1" />
    <circle cx="10" cy="12" r="3.5" fill="#14F195" />
    <text x="20" y="16" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#F8D057" letter-spacing="0.05em">
      SOLANA DEVNET
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="110" y="78" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="0.16em" fill="#8E929E">
    VERIFIED TOURISM AI AGENTS &amp; ON-CHAIN ITINERARIES
  </text>
</svg>
